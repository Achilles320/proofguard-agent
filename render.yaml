# Preflight-only deployment. Free instances sleep; not suitable for scored rounds.
services:
  - type: web
    name: proofguard-agent-preflight
    runtime: node
    plan: free
    repo: https://github.com/Achilles320/proofguard-agent
    branch: feat/preflight-bootstrap
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AGENT_GAMES_HMAC_SECRET
        sync: false
